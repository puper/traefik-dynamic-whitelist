<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>安全网关控制台</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="shell">
      <section id="authView" class="panel auth-panel">
        <h1>安全网关验证</h1>
        <form id="authForm" class="form">
          <label class="field">
            <span>访问凭证</span>
            <input id="tokenInput" type="password" autocomplete="current-password" placeholder="请输入访问凭证 (Token)" required>
          </label>
          <button id="authButton" class="button primary" type="submit">验证并进入</button>
        </form>
      </section>

      <section id="dashboardView" class="dashboard hidden">
        <header class="topbar">
          <div>
            <p class="label">您当前检测到的访问 IP</p>
            <strong id="currentIP" class="current-ip">-</strong>
          </div>
          <button id="logoutButton" class="button ghost" type="button">退出</button>
        </header>

        <section class="actions" aria-label="授权操作">
          <label class="field ip-field">
            <span>授权 IP</span>
            <input id="targetIPInput" type="text" inputmode="decimal" autocomplete="off" placeholder="留空则使用当前检测 IP">
          </label>
          <button id="tempButton" class="button primary" type="button">临时授权当前检测 IP</button>
          <button id="permButton" class="button success" type="button">永久授权当前检测 IP</button>
        </section>

        <section class="lists">
          <article class="panel">
            <h2>生效中的临时 IP</h2>
            <div id="temporaryList" class="list"></div>
          </article>

          <article class="panel">
            <h2>永久白名单 IP</h2>
            <div id="permanentList" class="list compact"></div>
          </article>
        </section>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
