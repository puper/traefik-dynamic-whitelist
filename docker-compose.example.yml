services:
  traefik-dynamic-whitelist:
    build: .
    container_name: traefik-dynamic-whitelist
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: "change-me-use-a-long-random-token"
      LISTEN_ADDR: ":8080"
      STATE_PATH: "/data/state.json"
      TRAEFIK_DYNAMIC_PATH: "/traefik-dynamic/whitelist.yml"
      TEMP_HOURS: "24"
      CLEANUP_INTERVAL: "1m"
      CLIENT_IP_HEADERS: "CF-Connecting-IP,X-Forwarded-For,X-Real-IP"
      # Set this to the Docker network CIDR or Traefik container IP that connects to this service.
      TRUSTED_PROXIES: "172.16.0.0/12"
      # For Cloudflare -> Traefik, Traefik usually needs to read client IP from X-Forwarded-For.
      TRAEFIK_IP_STRATEGY_DEPTH: "1"
    volumes:
      - ./data:/data
      # Mount the same host directory into Traefik as a file provider dynamic config directory.
      - ./traefik-dynamic:/traefik-dynamic
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whitelist-console.rule=Host(`gateway.example.com`) && Header(`X-CDN-Token`, `your-long-random-cdn-token`)"
      - "traefik.http.routers.whitelist-console.entrypoints=websecure"
      - "traefik.http.routers.whitelist-console.tls=true"
      - "traefik.http.services.whitelist-console.loadbalancer.server.port=8080"

networks:
  traefik:
    external: true
